[project]
name = "pytorch-cuda-lab"
version = "0.1.0"
description = "A hands-on lab for learning PyTorch internals and GPU/CUDA mechanisms, using melt-curve time-series classification as the workload."
readme = "README.md"
# Capped below 3.14 because torch has no 3.14 CUDA wheels yet; avoids a resolver split.
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "boto3>=1.35",
    "pymongo>=4.8",       # provides the `bson` module used to decode the S3 BSON blobs
    "matplotlib>=3.9",
    "tqdm>=4.66",
]

# Torch is an OPTIONAL extra: the CUDA wheels are large and come from a custom index.
# Install with:  uv sync --extra torch
# Do NOT use `uv add torch --index-url ...` -- that flag REPLACES PyPI for the whole
# resolution, so non-torch deps (boto3, etc.) can no longer be found. The index is
# registered below, scoped to torch only, so PyPI stays the default for everything else.
[project.optional-dependencies]
torch = ["torch>=2.5"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",   # notebooks/ is the learning playground
    "ruff>=0.6",
]

# CUDA wheel index for torch, used ONLY for packages pinned to it via tool.uv.sources.
# `explicit = true` keeps PyPI as the default index for everything else.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpulab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
